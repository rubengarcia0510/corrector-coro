spring.application.name=corrector-coro
server.port=8080

# Limites de subida generosos para el spike (los limites reales del MVP -
# 5 min / ~7MB por cancion, ver CDC-1 en Jira - se aplican en el backend definitivo)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

# CDM-13 - Chroma + DTW intonation analysis
chorus.analysis.sample-rate=44100
chorus.analysis.frame-size=4096
chorus.analysis.hop-size=1024
chorus.analysis.chroma.bins=12
chorus.analysis.dtw.enabled=true
chorus.analysis.intonation.warning-cents=10
chorus.analysis.intonation.error-cents=20
chorus.analysis.intonation.severe-cents=35
chorus.analysis.intonation.min-error-frames=3

# CDM-14 - Speechmatics
speechmatics.base-url=${SPEECHMATICS_BASE_URL:https://asr.api.speechmatics.com}
speechmatics.api-key=${SPEECHMATICS_API_KEY:}
